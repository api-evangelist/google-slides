naftiko: 1.0.0-alpha2
info:
  label: Google Slides Presentation Management
  description: Unified presentation management workflow for creating, reading, editing, and generating thumbnails of Google
    Slides presentations for content creators and automation engineers.
  tags:
  - Google
  - Slides
  - Presentations
  - Content Creation
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    GOOGLE_OAUTH_TOKEN: GOOGLE_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: slides-api
    baseUri: https://slides.googleapis.com
    description: Google Slides API for creating and editing presentations.
    authentication:
      type: bearer
      token: '{{GOOGLE_OAUTH_TOKEN}}'
    resources:
    - name: presentations
      path: /v1/presentations
      description: Manage presentations.
      operations:
      - name: create-presentation
        method: POST
        description: Create a blank presentation.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            title: '{{tools.title}}'
      - name: get-presentation
        method: GET
        description: Get a presentation by ID.
        inputParameters:
        - name: presentationId
          in: path
          type: string
          required: true
          description: Presentation ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: batch-update-presentation
        method: POST
        description: Apply batch updates to a presentation.
        inputParameters:
        - name: presentationId
          in: path
          type: string
          required: true
          description: Presentation ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            requests: '{{tools.requests}}'
    - name: pages
      path: /v1/presentations/{presentationId}/pages
      description: Manage pages within presentations.
      operations:
      - name: get-page
        method: GET
        description: Get a specific page.
        inputParameters:
        - name: presentationId
          in: path
          type: string
          required: true
          description: Presentation ID.
        - name: pageObjectId
          in: path
          type: string
          required: true
          description: Page object ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-page-thumbnail
        method: GET
        description: Get a thumbnail image of a page.
        inputParameters:
        - name: presentationId
          in: path
          type: string
          required: true
          description: Presentation ID.
        - name: pageObjectId
          in: path
          type: string
          required: true
          description: Page object ID.
        - name: thumbnailProperties.mimeType
          in: query
          type: string
          required: false
          description: Thumbnail MIME type (PNG).
        - name: thumbnailProperties.thumbnailSize
          in: query
          type: string
          required: false
          description: Thumbnail size.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: presentation-api
    description: Unified REST API for Google Slides presentation management.
    resources:
    - path: /v1/presentations
      name: presentations
      description: Create and manage presentations.
      operations:
      - method: POST
        name: create-presentation
        description: Create a new presentation.
        call: slides-api.create-presentation
        with:
          title: rest.title
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: get-presentation
        description: Get a presentation by ID.
        call: slides-api.get-presentation
        with:
          presentationId: rest.presentationId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: batch-update
        description: Apply batch updates.
        call: slides-api.batch-update-presentation
        with:
          presentationId: rest.presentationId
          requests: rest.requests
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pages
      name: pages
      description: Access individual pages and thumbnails.
      operations:
      - method: GET
        name: get-page
        description: Get a specific page.
        call: slides-api.get-page
        with:
          presentationId: rest.presentationId
          pageObjectId: rest.pageObjectId
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: get-page-thumbnail
        description: Get a page thumbnail.
        call: slides-api.get-page-thumbnail
        with:
          presentationId: rest.presentationId
          pageObjectId: rest.pageObjectId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: presentation-mcp
    transport: http
    description: MCP server for AI-assisted Google Slides presentation creation and editing.
    tools:
    - name: create-presentation
      description: Create a new blank Google Slides presentation.
      hints:
        readOnly: false
      call: slides-api.create-presentation
      with:
        title: tools.title
      outputParameters:
      - type: object
        mapping: $.
    - name: get-presentation
      description: Get a presentation by ID with all slides, masters, and layouts.
      hints:
        readOnly: true
      call: slides-api.get-presentation
      with:
        presentationId: tools.presentationId
      outputParameters:
      - type: object
        mapping: $.
    - name: batch-update-presentation
      description: Apply batch updates to a presentation (add slides, insert text, create shapes, embed images).
      hints:
        readOnly: false
      call: slides-api.batch-update-presentation
      with:
        presentationId: tools.presentationId
        requests: tools.requests
      outputParameters:
      - type: object
        mapping: $.
    - name: get-page
      description: Get a specific page from a presentation.
      hints:
        readOnly: true
      call: slides-api.get-page
      with:
        presentationId: tools.presentationId
        pageObjectId: tools.pageObjectId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-page-thumbnail
      description: Get a thumbnail image of a presentation page.
      hints:
        readOnly: true
      call: slides-api.get-page-thumbnail
      with:
        presentationId: tools.presentationId
        pageObjectId: tools.pageObjectId
      outputParameters:
      - type: object
        mapping: $.
